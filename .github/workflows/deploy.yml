name: Test and deploy TRIP

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-build-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Install the original Originkit component
        env:
          ORIGINKIT_API_KEY: ${{ secrets.ORIGINKIT_API_KEY }}
        run: |
          if [ -z "$ORIGINKIT_API_KEY" ]; then
            echo "::error::Add the ORIGINKIT_API_KEY repository secret to install the original Cluster About Glossy source in CI."
            exit 1
          fi
          npx originkit@latest add cluster-about-glossy --base --path src/components --auth "$ORIGINKIT_API_KEY"
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
      - name: Deploy to Cloudflare Workers
        run: npx wrangler deploy
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
